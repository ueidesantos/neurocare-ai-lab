services:
  api:
    build:
      context: .
      dockerfile: src/NeuroCare.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  web:
    build:
      context: ./web/neurocare-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
